[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkwords-backend"
version = "0.1.0"
description = "Stateless FastAPI service for LinkWords"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "nltk>=3.9.1",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
arabic = [
    "camel-tools>=1.5.5",
    "farasapy>=0.0.14",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
japanese = [
    "sudachipy>=0.6.8",
    "sudachidict_core>=20250129",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["linkwords_backend*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
