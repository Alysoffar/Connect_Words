[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkwords-pipeline"
version = "0.1.0"
description = "Offline data and puzzle-generation jobs for LinkWords"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=1.26",
    "nltk>=3.9.1",
    "sentence-transformers>=3.3.1",
    "tqdm>=4.67.1",
    "wordfreq>=3.1.1",
]

[project.scripts]
linkwords-pipeline = "linkwords_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
